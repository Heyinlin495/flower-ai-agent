# =============================================================================
# CI — Pull Request 自动测试
#   触发：任何 PR（含 draft）
#   内容：语法检查 + pytest（进程内 ASGI，无需启动外部服务）
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:        # 手动触发

jobs:
  test:
    name: 语法检查 + pytest
    runs-on: ubuntu-latest
    # 并发：同一 PR 多次推送只跑最新一次，旧的自动取消
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 依赖哈希缓存，未变化则秒装
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: 语法检查（所有 Python 文件）
        run: |
          python -m compileall -q backend frontend tests

      - name: 运行 pytest
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          DASHSCOPE_ANTHROPIC_URL: ${{ secrets.DASHSCOPE_ANTHROPIC_URL }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET_NAME: ${{ secrets.OSS_BUCKET_NAME }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: python -m pytest tests/ -v

      - name: 上传 pytest 报告（失败时保留现场）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7
